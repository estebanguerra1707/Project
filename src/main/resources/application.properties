spring.application.name=tu-sistema

server.port=8080
server.servlet.context-path=/api

# Configuración base de Base de Datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mitienda}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASS:admin}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.repair=true
spring.flyway.validate-on-migrate=false

# JWT (Mapeo correcto para el Provider)
mi-tienda.jwt.secret=${JWT_SECRET:default_secret_for_local_development_must_be_32_chars!}
mi-tienda.jwt.secret-base64=false
JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:7200000}

# Zona Horaria
spring.jackson.time-zone=America/Mexico_City
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

# Actuator & Swagger
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Mailjet (Usando variables de entorno por seguridad)
spring.mail.host=in-v3.mailjet.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mailjet.apikey.public=${MAILJET_PUBLIC}
mailjet.apikey.private=${MAILJET_PRIVATE}

alertas.stock.email.destinatario=esguerra0717@gmail.com
alertas.stock.email.origen=esguerra0717@gmail.com

# Spring MVC & Configuración de Errores
spring.main.allow-bean-definition-overriding=true
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
server.error.include-message=always
server.error.include-exception=true
spring.mvc.log-request-details=true

# Logging Base
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.com.mx.mitienda=DEBUG

# Scheduler (limpieza de tokens)
valid.token.hour=1
spring.task.scheduling.pool.size=2

